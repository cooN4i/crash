services:
  db:
    image: postgres:15-alpine
    container_name: crash_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crash_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: crash_game_server
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/crash_db
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn server:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
