name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Check PEP 8 formatting with flake8
        run: |
          flake8 --ignore=E501 server.py game_state.py models.py database.py test_game.py

      - name: Run unit tests
        run: |
          python test_game.py

  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crash-game:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/crash-game:${{ github.sha }}

  deploy:
    name: Deploy to Remote Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting Crash Deployment ==="
            if ! command -v docker &> /dev/null; then
              echo "Docker not found on server! Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sh get-docker.sh
            fi
            
            mkdir -p /opt/crash
            cd /opt/crash

            cat << 'EOF' > docker-compose.yml
            services:
              db:
                image: postgres:15-alpine
                container_name: crash_postgres
                restart: always
                environment:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: postgrespassword
                  POSTGRES_DB: crash_db
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              web:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/crash-game:latest
                container_name: crash_game_server
                restart: always
                ports:
                  - "8000:8000"
                environment:
                  - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/crash_db
                  - ENVIRONMENT=production
                depends_on:
                  db:
                    condition: service_healthy
                command: sh -c "alembic upgrade head && uvicorn server:app --host 0.0.0.0 --port 8000"

            volumes:
              postgres_data:
            EOF

            echo "Pulling latest web image from Docker Hub..."
            docker compose pull web
            echo "Restarting containers..."
            docker compose up -d
            echo "Current container status:"
            docker compose ps
            echo "=== Deployment finished successfully! ==="
